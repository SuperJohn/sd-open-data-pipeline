name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SD311_SOURCE: sample
      SD311_DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Build warehouse + dbt docs site
        run: |
          mkdir -p data/warehouse
          uv run python -m sd311.ingest --source sample
          uv run dbt build --project-dir dbt --profiles-dir dbt
          uv run dbt docs generate --project-dir dbt --profiles-dir dbt
          uv run python -c "from pathlib import Path; from sd311.docs import package_docs_site; print('packed', *[p.name for p in package_docs_site(Path('dbt/target'), Path('site'))])"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
