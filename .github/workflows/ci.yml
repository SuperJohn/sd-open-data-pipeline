name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SD311_SOURCE: sample
      SD311_DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit + integration tests
        run: uv run pytest -q

      - name: Load sample + dbt build (models + data tests)
        run: |
          mkdir -p data/warehouse
          uv run python -m sd311.ingest --source sample
          uv run dbt source freshness --project-dir dbt --profiles-dir dbt
          uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: Generate and package dbt docs
        run: |
          uv run dbt docs generate --project-dir dbt --profiles-dir dbt
          uv run python -c "from pathlib import Path; from sd311.docs import package_docs_site; print('packed', *[p.name for p in package_docs_site(Path('dbt/target'), Path('site'))])"

      - name: Dagster end-to-end materialization
        run: |
          export DAGSTER_HOME=$(mktemp -d)
          uv run dagster asset materialize -m sd311.definitions --select '*' \
            --config-json '{"ops": {"raw__get_it_done_requests": {"config": {"source": "sample"}}}}'

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: dbt/target/*.json
          if-no-files-found: ignore

      - name: Upload docs site artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs-site
          path: site

  docker:
    # Builds the image and smoke-tests `docker compose up`: pipeline must finish,
    # then the Dagster UI and the dashboard must both report healthy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for pipeline and UIs
        run: |
          for i in $(seq 1 60); do
            state=$(docker compose ps -a pipeline --format '{{.State}} {{.ExitCode}}')
            case "$state" in
              "exited 0") break ;;
              exited*) echo "pipeline failed: $state"; exit 1 ;;
            esac
            sleep 5
          done
          for i in $(seq 1 40); do
            d=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/server_info || true)
            s=$(curl -s http://localhost:8501/_stcore/health || true)
            if [ "$d" = "200" ] && [ "$s" = "ok" ]; then
              echo "dagster=$d dashboard=$s"
              exit 0
            fi
            sleep 3
          done
          echo "timed out: dagster=$d dashboard=$s"
          exit 1

      - name: Check the warehouse was built
        run: |
          docker compose exec -T dashboard python -c "
          import duckdb, os
          con = duckdb.connect(os.environ['SD311_DUCKDB_PATH'], read_only=True)
          n = con.execute('select count(*) from marts.fct_requests').fetchone()[0]
          print('fct_requests rows:', n)
          assert n > 0
          "

      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
