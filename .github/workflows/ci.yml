name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SD311_SOURCE: sample
      SD311_DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit + integration tests
        run: uv run pytest -q

      - name: Load sample + dbt build (models + data tests)
        run: |
          mkdir -p data/warehouse
          uv run python -m sd311.ingest --source sample
          uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: Generate dbt docs site
        run: |
          uv run dbt docs generate --project-dir dbt --profiles-dir dbt
          uv run python -c "from pathlib import Path; from sd311.docs import package_docs_site; \
print('packed', *[p.name for p in package_docs_site(Path('dbt/target'), Path('site'))])"

      - name: Dagster end-to-end materialization
        run: |
          export DAGSTER_HOME=$(mktemp -d)
          uv run dagster asset materialize -m sd311.definitions --select '*' \
            --config-json '{"ops": {"raw__get_it_done_requests": {"config": {"source": "sample"}}}}'

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: dbt/target/*.json
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
