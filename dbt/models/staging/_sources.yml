version: 2
sources:
  - name: raw
    description: Landing zone. Loaded by `sd311.ingest` (Dagster asset `raw/get_it_done_requests`), all
      columns VARCHAR.
    schema: raw
    tables:
      - name: get_it_done_requests
        description: 'City of San Diego "Get It Done" 311 service requests (open requests + requests closed
          by close year from CLOSED_START_YEAR onward). Source: https://data.sandiego.gov/datasets/get-it-done-311/

          '
        # Ingest stamps `_loaded_at` at load time. Daily schedule expects a fresh load within ~1 day;
        # warn at 24h and error at 48h so a missed run surfaces before the weekend piles up.
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: service_request_id
            data_tests:
              - not_null
          - name: date_requested
            data_tests:
              - not_null
        data_tests:
          - min_row_count:
              arguments:
                min_rows: 100
