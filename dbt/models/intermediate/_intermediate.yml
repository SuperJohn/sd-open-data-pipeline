version: 2
models:
  - name: int_requests__enriched
    description: Requests enriched with lifecycle flags, resolution time, calendar attributes and
      council district assigned from official GIS boundaries.
    columns:
      - name: service_request_id
        data_tests:
          - unique
          - not_null
      - name: days_to_close
        data_tests:
          - in_range:
              arguments:
                min_value: 0
                max_value: 3650
              config:
                severity: warn
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Self-service
                  - Assisted
                  - Internal / other
      - name: gis_council_district
        description: District whose official polygon contains the request's geocode (null when
          the geocode is invalid or falls outside every district).
        data_tests:
          - in_range:
              arguments:
                min_value: 1
                max_value: 9
      - name: council_district
        description: GIS district when available, else the city-reported district.
        data_tests:
          - in_range:
              arguments:
                min_value: 1
                max_value: 9
      - name: council_district_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - gis
                  - reported
                  - none
